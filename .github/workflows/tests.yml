name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Same database and cache versions as the local Docker setup.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: halfpast_test
          POSTGRES_USER: halfpast
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halfpast -d halfpast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: halfpast_test
      DB_USERNAME: halfpast
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, exif, gd, intl, pcntl, pdo_pgsql, posix, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      - name: Check dependencies for known vulnerabilities
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

      - name: Run CI Checks
        run: composer ci:check

      # Failing tests become annotations on the run, readable without the full log.
      - name: Report failing tests
        if: failure() && hashFiles('storage/logs/junit.xml') != ''
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse('storage/logs/junit.xml').iter('testcase'):
              for problem in list(case.findall('failure')) + list(case.findall('error')):
                  text = (problem.text or problem.get('message') or '').strip().splitlines()
                  detail = ' / '.join(line.strip() for line in text[:6])[:900]
                  print(f"::error title={case.get('class', '')}::{case.get('name', '')}: {detail}")
          PY
