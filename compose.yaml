name: halfpast

# Shared by every container that runs the Laravel code.
x-app: &app
    image: halfpast-app:dev
    # Back up after a crash, or when Docker starts again after a reboot.
    restart: unless-stopped
    build:
        context: .
        target: dev
        args:
            UID: ${HOST_UID:-1000}
            GID: ${HOST_GID:-1000}
    volumes:
        - .:/app
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    app:
        <<: *app
        ports:
            - '${APP_PORT:-8000}:8000'

    vite:
        <<: *app
        command: ['npm', 'run', 'dev']
        ports:
            - '${VITE_PORT:-5173}:5173'
        # The image's health check probes FrankenPHP, which this container doesn't run.
        healthcheck:
            disable: true

    # Background work: confirmation emails now, reminders later.
    queue:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--backoff=10']
        healthcheck:
            disable: true

    # Scheduled tasks, every minute: releasing lapsed holds, reminders later.
    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true

    # Live updates: open calendars refresh the moment a booking comes in.
    reverb:
        <<: *app
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        healthcheck:
            disable: true

    # Optional. Forwards Stripe's test-mode webhooks to the app, so payments
    # settle locally the way they will in production. Start it with
    # `make stripe-webhooks`; it needs STRIPE_SECRET in .env.
    stripe:
        image: stripe/stripe-cli:v1.50.11
        profiles: ['stripe']
        environment:
            STRIPE_API_KEY: ${STRIPE_SECRET:-}
        command:
            - listen
            - --forward-to
            - http://app:8000/webhooks/stripe
            - --events
            - checkout.session.completed,checkout.session.expired,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-halfpast}
            POSTGRES_USER: ${DB_USERNAME:-halfpast}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - postgres:/var/lib/postgresql/data
            - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
        ports:
            - '${FORWARD_DB_PORT:-55432}:5432'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8.2-alpine
        restart: unless-stopped
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:v1.31
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
    postgres:
    redis:
